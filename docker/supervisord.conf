[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[program:frankenphp]
command=/usr/local/bin/frankenphp run --config /etc/caddy/Caddyfile --adapter caddyfile
autostart=true
autorestart=true
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Click recording. Scale with CLICK_WORKERS.
[program:clicks]
command=php /app/artisan queue:work redis --queue=clicks,default --sleep=1 --tries=3 --max-time=3600
numprocs=%(ENV_CLICK_WORKERS)s
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
